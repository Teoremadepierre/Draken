[project]
name = "draken"
version = "0.1.0"
description = "Draken SEO Suite - self-hosted SEO intelligence, backlink acquisition and AI-visibility platform"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "tldextract>=5.1",
    "python-dateutil>=2.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23", "ruff>=0.5", "pyyaml>=6.0"]
postgres = ["psycopg[binary]>=3.1"]
browser = ["playwright>=1.44"]

[project.scripts]
draken = "draken.cli.main:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["draken*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: FastAPI's Depends() in defaults is the documented pattern.
# E501: long lines are formatted by hand in the seed tables.
# UP042: `str, Enum` (not StrEnum) keeps `.value` round-tripping through
#        SQLAlchemy string columns and pydantic unchanged.
ignore = ["B008", "E501", "UP042"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
