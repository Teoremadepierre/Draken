<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Orphan page nobody links to</title>
<meta name="description" content="This page is in the sitemap but has no internal inlinks."></head><body>
<h1>Orphan</h1><h2>Why this matters</h2><p>A page in the sitemap that nothing links to is invisible to link equity, and usually a sign the internal linking was never finished. Draken flags these separately from 404s because the fix is different: add a link, do not redirect.</p></body></html>
