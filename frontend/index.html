<!doctype html>
<html lang="es" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Draken SEO Suite</title>
<link rel="icon" href="/static/assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/css/app.css">
</head>
<body>

<div id="login" class="login-screen" hidden>
  <form class="login-card" id="login-form">
    <div class="login-brand">
      <img src="/static/assets/logo.svg" alt="" width="36" height="36">
      <span>Draken</span>
    </div>
    <p class="login-sub" data-i18n="login.sub">Panel interno de SEO y backlinks</p>
    <label class="field">
      <span data-i18n="login.user">Usuario</span>
      <input name="username" autocomplete="username" required>
    </label>
    <label class="field">
      <span data-i18n="login.pass">Contraseña</span>
      <input name="password" type="password" autocomplete="current-password" required>
    </label>
    <button class="btn btn-primary btn-block" type="submit" data-i18n="login.submit">Entrar</button>
    <p class="login-error" id="login-error" hidden></p>
  </form>
</div>

<div id="app" class="app" hidden>
  <button class="nav-toggle" id="nav-toggle" aria-label="Menu">
    <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg>
  </button>

  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <img src="/static/assets/logo.svg" alt="" width="28" height="28">
      <div>
        <strong>Draken</strong>
        <small data-i18n="brand.tag">SEO Suite</small>
      </div>
    </div>

    <div class="project-switch">
      <label class="sr-only" for="project-select" data-i18n="nav.project">Proyecto</label>
      <select id="project-select" class="select"></select>
      <button class="btn btn-ghost btn-icon" id="new-project" title="Nuevo proyecto" aria-label="Nuevo proyecto">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg>
      </button>
    </div>

    <nav class="nav" id="nav"></nav>

    <div class="sidebar-foot">
      <div class="lang-switch" role="group" aria-label="Idioma">
        <button data-lang="es" class="lang-btn is-active">ES</button>
        <button data-lang="en" class="lang-btn">EN</button>
      </div>
      <div class="env-badges" id="env-badges"></div>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="topbar-title">
        <h1 id="view-title">Dashboard</h1>
        <p id="view-sub" class="muted"></p>
      </div>
      <div class="topbar-actions" id="view-actions"></div>
    </header>
    <div class="content" id="view"></div>
  </main>
</div>

<div class="toasts" id="toasts" aria-live="polite"></div>

<div class="modal-backdrop" id="modal-backdrop" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <header class="modal-head">
      <h2 id="modal-title"></h2>
      <button class="btn btn-ghost btn-icon" id="modal-close" aria-label="Cerrar">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg>
      </button>
    </header>
    <div class="modal-body" id="modal-body"></div>
    <footer class="modal-foot" id="modal-foot"></footer>
  </div>
</div>

<script type="module" src="/static/js/main.js"></script>
</body>
</html>
