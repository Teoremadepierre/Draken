# Draken SEO Suite - reverse proxy.
# Run `certbot --nginx -d seo.example.com` after enabling this file; certbot
# rewrites the listen directives and adds the TLS block.

server {
    listen 80;
    listen [::]:80;
    server_name seo.example.com;          # <-- change this

    # This is an internal tool: never let it be indexed.
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = /robots.txt {
        add_header Content-Type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    # Audits and AI visibility runs are long; do not cut them off.
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_buffering off;
    }

    location /static/ {
        proxy_pass http://127.0.0.1:8000/static/;
        proxy_cache_valid 200 10m;
        expires 10m;
        add_header Cache-Control "public";
    }
}
