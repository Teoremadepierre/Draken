services:
  draken:
    build: .
    image: draken:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DRAKEN_ENV: production
      DRAKEN_DATABASE_URL: sqlite:////app/data/draken.db
      # Everything else is read from .env; see .env.example.
    env_file:
      - .env
    volumes:
      # The database and the editable seed datasets live here.
      - ./data:/app/data
    # The image runs as an unprivileged user, so the bind-mounted ./data must be
    # writable by it. Either run `sudo chown -R 1000:1000 ./data` once, or
    # uncomment the next line to run as your own user:
    # user: "${UID:-1000}:${GID:-1000}"

  # Uncomment for Postgres instead of SQLite, and set
  # DRAKEN_DATABASE_URL=postgresql+psycopg://draken:draken@db:5432/draken
  #
  # db:
  #   image: postgres:16-alpine
  #   restart: unless-stopped
  #   environment:
  #     POSTGRES_USER: draken
  #     POSTGRES_PASSWORD: draken
  #     POSTGRES_DB: draken
  #   volumes:
  #     - pgdata:/var/lib/postgresql/data
  #
  # volumes:
  #   pgdata:
