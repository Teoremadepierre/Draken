# Render blueprint: deploys Draken plus a Postgres database.
#
# Use: push this repo to your GitHub, then in Render choose
# New -> Blueprint, pick the repo, and Render reads this file.
# You get https://<name>.onrender.com in a few minutes.
#
# Postgres, not SQLite, because Render's disk is ephemeral on the free plan:
# a restart would wipe an SQLite file.

databases:
  - name: draken-db
    databaseName: draken
    user: draken
    plan: free

services:
  - type: web
    name: draken
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DRAKEN_DATABASE_URL
        fromDatabase:
          name: draken-db
          property: connectionString
      - key: DRAKEN_ENV
        value: production
      - key: DRAKEN_SECRET_KEY
        generateValue: true          # Render generates and stores it
      - key: DRAKEN_AUTH_ENABLED
        value: "true"
      - key: DRAKEN_ADMIN_USER
        value: admin
      - key: DRAKEN_ADMIN_PASSWORD
        sync: false                  # you type this in the Render dashboard
      - key: DRAKEN_USER_AGENT
        value: DrakenSEO/0.1 (+https://github.com/Teoremadepierre/Draken)
      # Everything below is optional; add the keys you have.
      - key: DRAKEN_ANTHROPIC_API_KEY
        sync: false
      - key: DRAKEN_GSC_SERVICE_ACCOUNT_FILE
        sync: false
      - key: DRAKEN_BING_WEBMASTER_API_KEY
        sync: false
      - key: DRAKEN_SERPAPI_KEY
        sync: false
